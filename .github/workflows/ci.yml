name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e src/ros2_fastfetch/ click rich psutil flask climage pillow pyyaml lark
          pip install pytest pytest-cov flake8 mypy

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=src/ros2_fastfetch/fetch_info --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Run flake8
        run: |
          flake8 src/ros2_fastfetch/fetch_info --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ros2_fastfetch/fetch_info --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run mypy (if type hints present)
        run: |
          mypy src/ros2_fastfetch/fetch_info --ignore-missing-imports || true

  rust:
    name: Rust TUI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/tui
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/tui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/tui/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --verbose
