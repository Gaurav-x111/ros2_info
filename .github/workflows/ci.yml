name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e src/ros2_fastfetch/ click rich psutil flask climage pillow pyyaml lark
          uv pip install flake8 mypy
      - name: Run flake8
        run: |
          source .venv/bin/activate
          flake8 src/ros2_fastfetch/fetch_info --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ros2_fastfetch/fetch_info --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run mypy (if type hints present)
        run: |
          source .venv/bin/activate
          mypy src/ros2_fastfetch/fetch_info --ignore-missing-imports || true
  rust:
    name: Rust TUI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/tui
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/tui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/tui/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --verbose
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --verbose