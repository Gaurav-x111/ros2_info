[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .venv __pycache__ .claude src/backend src/tui
addopts = --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests that need network access