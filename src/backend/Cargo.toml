[package]
name = "ros2-info-rt"
version = "0.1.0"
edition = "2021"
description = "ROS2 Info real-time backend — high-performance WebSocket server"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs"] }
sysinfo = "0.33"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
base64 = "0.22"
